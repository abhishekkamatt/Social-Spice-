<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Parampara · Your Digital Companion</title>

<style>
:root{--g:#153020;--g0:#0c1f14;--c:#f0ebdc;--c2:#e6e0cb;--o:#e8892b;--o2:#b9531a;--au:#c9a24a;--mut:#153020b3;
--disp:'Bodoni Moda','Didot',serif;--body:'Cormorant Garamond',Georgia,serif;--sans:'Poppins',system-ui,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#153020;--c:#f0ebdc}}
:root[data-theme="dark"]{--g:#153020;--c:#f0ebdc}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--c);color:var(--g);font:600 19px/1.65 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}
:focus-visible{outline:2px solid var(--o);outline-offset:3px}
#app{max-width:760px;margin:0 auto;padding-bottom:110px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.top .lg{font:600 20px/1 var(--disp);text-decoration:none}.top .lg small{display:block;font:400 8px var(--sans);letter-spacing:.4em;margin-top:5px;opacity:.65}
.bell{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--au);background:none;font-size:18px}
.bell i{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--o2)}
.hero{background:linear-gradient(#153020,#0c1f14);color:var(--c);text-align:center;border-radius:0 0 40px 40px;padding:6px 24px 44px;margin-bottom:26px}
.hero .top{color:var(--c);padding:16px 0}.hero .bell{color:var(--c);border-color:#f0ebdc55}
.hero .k{font:400 12px var(--sans);letter-spacing:.14em;margin-top:18px}
.tex{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.035' numOctaves='4' seed='7'/><feColorMatrix values='0 0 0 0 .52  0 0 0 0 .62  0 0 0 0 .55  9 0 0 0 -4.5'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),linear-gradient(#f6f1e1,#e8e2ca);background-size:400px 400px,auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 1px #0000006e) drop-shadow(0 -1px 0 #ffffff1f)}
@supports not (background-clip:text){.tex{color:var(--c);-webkit-text-fill-color:currentColor}}
.hero h1{font:500 clamp(44px,13.4vw,84px)/1.08 var(--disp);letter-spacing:.035em;text-transform:uppercase;margin:34px 0 0}
.hi{font:400 clamp(30px,9.4vw,56px)/1.4 'Tiro Devanagari Hindi',serif;word-spacing:.28em;margin:6px 0 0}
.tm{margin:34px auto 0;max-width:420px}
.tm .lb{font:500 12px var(--sans);letter-spacing:.22em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px}
.tm .dg{display:flex;justify-content:center;align-items:flex-start;gap:8px}
.tm .dg>div{background:#ffffff12;border:1px solid #c9a24a88;border-radius:14px;min-width:84px;padding:12px 6px 10px}
.tm .dg b{display:block;font:500 clamp(34px,10vw,48px)/1.1 var(--disp);font-variant-numeric:tabular-nums}
.tm small{font:400 9px var(--sans);letter-spacing:.2em;opacity:.7}
.tm .dg>span{font:500 34px/1.5 var(--disp);color:var(--au)}
.tm.live .lb i{width:9px;height:9px;border-radius:50%;background:#ff7a3d;animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #ff7a3d99}70%,100%{box-shadow:0 0 0 9px #0000}}
.tm.out .lb{font-size:17px;color:#f0b868}.tm.out .msg{font-size:21px;line-height:1.6;max-width:30ch;margin:0 auto}
@media (prefers-reduced-motion:reduce){.tm.live .lb i{animation:none}}
.hero p.s{margin:18px auto 0;max-width:30ch;font-size:21px;line-height:1.6}
.chip{display:inline-block;margin-top:22px;padding:8px 20px;border-radius:99px;background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;font:500 12px var(--sans);letter-spacing:.04em}
.pg{padding:0 20px}
.sub-top{display:flex;align-items:center;gap:12px;padding:16px 20px 6px}
.back{width:46px;height:46px;border-radius:50%;border:1px solid var(--g);background:none;font-size:20px;flex:none}
h2.pt{font:500 clamp(28px,7vw,38px)/1.25 var(--disp);margin:14px 20px 8px}
.lead{margin:0 20px 22px;color:var(--mut)}
.card{background:var(--c2);border:1px solid #15302033;border-radius:16px;padding:22px}
.pc{display:flex;align-items:center;gap:20px;margin-bottom:16px;text-decoration:none}
.ring{width:84px;height:84px;flex:none;position:relative}.ring svg{width:84px;height:84px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 22px var(--disp)}
.pc h3,.up h3{margin:0;font:600 22px/1.3 var(--disp)}.pc p,.up p{margin:4px 0 0;color:var(--mut);font-size:19px}
.cta{display:inline-flex;align-items:center;min-height:48px;margin-top:12px;padding:0 24px;border-radius:99px;border:0;background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;font:500 13px var(--sans);letter-spacing:.04em;text-decoration:none}
.cta.ghost{background:none;border:1px solid var(--g);color:var(--g)}.cta.done{background:var(--g)}
.grid5{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.nt{display:block;text-decoration:none;background:var(--g);color:var(--c);border-radius:16px;padding:20px 18px;min-height:112px}
.nt b{display:block;font:500 22px/1.25 var(--disp)}.nt span{font:400 13px/1.5 var(--sans);opacity:.75;display:block;margin-top:8px}
.nt.w{grid-column:1/-1;min-height:0}
.up{border-left:4px solid var(--o);margin-bottom:12px}.up small{font:500 11px var(--sans);letter-spacing:.14em;color:var(--o2)}
.imp{border-left-color:var(--o2);background:#e8892b22}
.stamps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px}
.sp{position:relative;display:flex;gap:14px;align-items:center;text-decoration:none;background:var(--c2);border:1px solid #15302033;border-radius:16px;padding:16px;min-height:96px}
.sp .no{flex:none;width:52px;height:52px;border-radius:50%;border:2px dashed var(--au);display:grid;place-items:center;font:500 20px var(--disp)}
.sp.on{background:var(--g);color:var(--c)}.sp.on .no{border:2px solid var(--o);background:var(--o);color:#fff}
.sp h3{margin:0;font:600 17px/1.3 var(--disp)}.sp small{font:500 10px var(--sans);letter-spacing:.12em;opacity:.7}
.tile{margin:14px 20px;border-radius:20px;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--c);background:linear-gradient(150deg,#235537,#0c1f14);position:relative;overflow:hidden}
.tile svg{position:absolute;width:190px;height:190px;opacity:.14;right:-40px;bottom:-50px}.tile small{font:500 11px var(--sans);letter-spacing:.3em;opacity:.8}.tile b{font:500 72px/1.1 var(--disp)}
.db{padding:0 20px}.db h1{font:600 clamp(28px,7vw,38px)/1.25 var(--disp);margin:6px 0 10px}.db p{margin:0 0 16px}
.db h4{font:500 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--o2);margin:30px 0 14px}
ol.st{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:14px}
ol.st li{counter-increment:s;display:grid;grid-template-columns:38px 1fr;gap:14px;font-size:20px;line-height:1.55}
ol.st li::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--g);color:var(--c);display:grid;place-items:center;font:500 14px var(--sans)}
.pf{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:20px;border-top:1px solid #15302026}
.lnk{background:none;border:0;padding:8px 0;text-decoration:underline;text-underline-offset:4px;font:500 13px var(--sans);text-align:left}
.tg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tg u{text-decoration:none;background:var(--g);color:var(--c);border-radius:99px;padding:3px 14px;font-size:15px}.tg u.p{background:var(--o2)}
.stall{margin:0 20px 14px}.stall small{font:700 12px var(--body);letter-spacing:.22em;color:var(--o2)}.stall h3{margin:4px 0 8px;font:600 24px/1.3 var(--disp)}.stall p{margin:0}
.sec{font:500 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;margin:26px 20px 12px;color:var(--o2)}
.fr{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid #15302020}
.badge{font:500 11px var(--sans);letter-spacing:.1em;border-radius:99px;padding:5px 14px;background:var(--g);color:var(--c);white-space:nowrap}.badge.p{background:var(--o2)}
.mp{display:flex;flex-wrap:wrap;gap:10px;margin:0 20px 8px}
.mp button{border:1px solid var(--g);background:none;border-radius:99px;min-height:46px;padding:0 18px;font:500 13px var(--sans)}
.mp button.cr{background:var(--c2)}
.note{margin:6px 20px 0;background:var(--c2);border-left:4px solid var(--au);border-radius:6px;padding:14px 18px;font-size:18px}
nav.tb{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--g0);display:flex;justify-content:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tb a{flex:1;max-width:120px;color:var(--c);text-decoration:none;text-align:center;font:500 11px var(--sans);padding:8px 2px;border-radius:12px;min-height:50px;opacity:.7}
nav.tb a b{display:block;font-size:19px;font-weight:400;line-height:1.3}
nav.tb a.on{opacity:1;background:#ffffff1c}
.sh{position:fixed;inset:0;z-index:50;background:#0c1f14cc;display:none;align-items:flex-end;justify-content:center}.sh.on{display:flex}
.sh>div{background:var(--c);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:28px 24px calc(28px + env(safe-area-inset-bottom,0px));animation:up .3s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh h3{margin:4px 0 8px;font:600 26px/1.25 var(--disp)}.sh .cat{font:500 11px var(--sans);letter-spacing:.2em;color:var(--o2);text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.sh>div{animation:none}}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 38%,#1b4429,#153422 60%,#102a1b);padding-top:6px}
.hero .top{position:relative;z-index:5;justify-content:flex-end}.hero .lg{display:none}.hero .bell{background:#0c1f14aa}
.hero .gl{position:absolute;right:0;top:0;width:clamp(76px,17%,128px);pointer-events:none}
.hero .dy{position:absolute;left:3%;top:0;width:clamp(66px,15%,104px);pointer-events:none}
.hero .sc{display:block;position:relative;width:min(66%,420px);margin:34px auto 0}
.hero h1.ttl{position:relative;margin:22px auto 0;width:min(96%,640px);font-size:0}.hero h1.ttl img{display:block;width:100%;filter:drop-shadow(0 3px 3px #0009)}
.hero .k{margin-top:26px;position:relative}.hero p.s,.hero .tm{position:relative}

/* ===== Welcome gate ===== */
body.lock{overflow:hidden}
.gate{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(120% 70% at 50% 20%,#1b4429,#153422 60%,#0c1f14);color:var(--c);padding:calc(28px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px))}
.gate.on{display:flex}
.gbox{width:100%;max-width:440px;margin:auto 0}
.gk{font:500 11px var(--sans);letter-spacing:.32em;color:var(--au);text-align:center}
.gate h2{font:500 clamp(28px,8vw,38px)/1.2 var(--disp);text-align:center;margin:14px 0 8px}
.gate .gp{text-align:center;opacity:.85;margin:0 0 26px;font-size:20px;line-height:1.5}
.gate label,.gate legend{display:block;font:500 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--au);margin:0 0 8px;padding:0}
.gate fieldset{border:0;margin:0 0 18px;padding:0;min-width:0}
.gate input[type=text]{width:100%;min-height:52px;border-radius:14px;border:1px solid #c9a24a99;background:#ffffff14;color:var(--c);padding:0 16px;font:500 17px var(--sans);margin-bottom:18px}
.gate input::placeholder{color:#f0ebdc80}
.gate input:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.wc{display:flex;flex-wrap:wrap;gap:10px}
.wc button{min-height:48px;padding:0 20px;border-radius:99px;border:1px solid #c9a24a99;background:#ffffff12;color:var(--c);font:500 14px var(--sans)}
.wc button[aria-pressed=true]{background:linear-gradient(135deg,var(--o),var(--o2));border-color:transparent;color:#fff}
.gate .err{min-height:22px;margin:0 0 6px;color:#f0b868;font:500 13px var(--sans)}
.gate .cta{width:100%;justify-content:center;margin-top:4px}
.gate .skip{display:block;margin:12px auto 0;color:var(--c);opacity:.75}
.hero .gr{position:relative;margin-top:24px;font:600 clamp(24px,7vw,32px)/1.3 'Dancing Script','Brush Script MT',cursive;color:#f3d9a0;overflow-wrap:anywhere}
.hero .ed{position:relative;color:var(--c);opacity:.75;margin-top:6px;font-size:12px}

/* ===== Stamp hunt / diya / memories ===== */
nav.tb a{font-size:10px}
.ring circle:last-child{animation:rg 1.1s ease}@keyframes rg{from{stroke-dashoffset:226}}
.stg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 20px;margin-bottom:18px}
.stm{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:24px;text-decoration:none;border:2px dashed var(--au);filter:grayscale(1);opacity:.5}
.stm.on{border:2px solid var(--o);background:linear-gradient(135deg,var(--o),var(--o2));filter:none;opacity:1;animation:pop .5s}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg)}70%{transform:scale(1.15)}100%{transform:none}}
.done10{margin:0 20px 18px;text-align:center}
.cx{text-align:center;padding:0 20px}.cx h1{font:500 clamp(40px,12vw,64px)/1.1 var(--disp);margin:20px 0 10px}
.cx canvas,.pcv{width:100%;max-width:340px;height:auto;border-radius:12px;box-shadow:0 8px 24px #0003;margin:14px auto;display:block}
.dst{margin:14px 20px;border-radius:22px;background:radial-gradient(100% 80% at 50% 40%,#1b4429,#0c1f14);color:var(--c);text-align:center;padding:30px 16px 36px;position:relative;overflow:hidden}
.dst h2{font:500 30px/1.2 var(--disp);margin:6px 0 8px}.dst p{margin:0 auto;max-width:26ch;font-size:21px;min-height:64px}
.dbtn{background:none;border:0;padding:0;width:230px;max-width:80%}.dbtn svg{width:100%;height:auto;display:block}
.dst .fl{opacity:0;transform:scale(.3);transform-origin:50% 100%;transition:opacity .6s,transform .7s}
.dst .gw{opacity:0;transition:opacity .9s}
.dst.lit .fl{opacity:1;transform:scale(1);animation:fk 2.4s ease-in-out infinite .7s}.dst.lit .gw{opacity:1}
@keyframes fk{50%{transform:scale(1.06,.95)}}
.dst .mgd{position:absolute;width:46px;height:46px;opacity:.9}
@media (prefers-reduced-motion:reduce){.dst.lit .fl,.stm.on,.ring circle:last-child{animation:none}.dst .fl,.dst .gw{transition:none}}
.pfb{display:inline-flex;margin:6px 4px 0}.drop{display:block;margin:0 20px;padding:18px;border:2px dashed var(--au);border-radius:16px;text-align:center;font:500 13px var(--sans)}

/* ===== V2: activity postcard ===== */
.pcd{position:relative;margin:6px 16px 20px;padding:22px 14px 26px;border-radius:6px;box-shadow:0 10px 28px #0000003d;border:1px solid #c9a24a88;background:#f0ebdc url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .2 0 0 0 .13 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.pcd::before{content:"";position:absolute;inset:7px;border:1px dashed #c9a24a;pointer-events:none;border-radius:3px}
.pch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 8px 4px}
.pch h2{font:500 clamp(26px,8vw,40px)/1.05 var(--disp);letter-spacing:.06em;margin:0}.pch p{margin:4px 0 0;font:500 11px var(--sans);letter-spacing:.14em;color:#245B9A}
.pm{flex:none;width:92px;color:#245B9A;opacity:.8;transform:rotate(-8deg)}
.mhs{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px;padding:14px 6px 4px;position:relative}
.mh{--b:#245B9A;flex:1 1 128px;max-width:200px;min-height:84px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;text-decoration:none;color:var(--b);border:3px double var(--b);outline:1.5px solid var(--b);outline-offset:3px;padding:12px 10px;transform:rotate(var(--r,0deg));filter:url(#rf);background:#245B9A0d;transition:transform .2s}
.mh:hover,.mh:focus-visible{transform:rotate(0) scale(1.04)}
.mh.lg{flex-basis:170px;max-width:240px;min-height:104px}.mh.sm{flex-basis:112px;min-height:76px}
.mh b{font:500 12px var(--sans);letter-spacing:.16em;opacity:.8}.mh span{font:700 clamp(15px,4.4vw,19px)/1.2 var(--body);text-transform:uppercase;letter-spacing:.03em;margin-top:3px;overflow-wrap:anywhere}
.cancel{display:block;width:100%;height:30px;color:#245B9A;opacity:.55;margin-top:6px}
.pcd .fine{text-align:center;font:400 11px var(--sans);letter-spacing:.1em;color:var(--mut);margin:10px 0 0}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}.gal img{width:100%;border-radius:6px}
.ty{margin:0 20px 8px;text-align:center}
.hero .ed2{position:relative;background:none;border:0;color:var(--c);opacity:.4;font-size:18px;line-height:1;padding:10px 14px;margin-top:2px}.hero .ed2:hover,.hero .ed2:focus-visible{opacity:.85}
@keyframes ink{from{opacity:0;transform:rotate(var(--r,0deg)) scale(1.6)}to{opacity:1;transform:rotate(var(--r,0deg)) scale(1)}}
.mh{animation:ink .45s ease-out}@media (prefers-reduced-motion:reduce){.mh{animation:none}}
.cn{font:600 clamp(24px,7vw,32px)/1.2 'Dancing Script','Brush Script MT',cursive;color:#245B9A;margin:6px 0 2px;overflow-wrap:anywhere}
.sth{display:block;max-width:220px;max-height:260px;width:auto;height:auto;margin:0 auto 12px;border-radius:10px}
.sr{text-align:center;margin-bottom:14px}.sr small{display:block;font:500 11px var(--sans);letter-spacing:.16em;color:var(--o2);margin-bottom:12px}.sr img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 6px}
.cons{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:17px;line-height:1.4}.cons input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:#b9531a}
.err2{color:#b9531a;font:500 13px var(--sans);min-height:20px;margin:8px 0}
.spin{width:54px;height:54px;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.hero .gr .ed2,.hero .k .ed2{display:inline-block;margin:0 0 0 4px;padding:6px 8px;font-size:.62em;vertical-align:middle;font-family:var(--sans)}


/* ===== Memories Menu / camera ===== */
.cta:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.gate [hidden]{display:none!important}
.mmh{text-align:center;padding:0 24px;margin:6px 0 16px}.mmh small{font:500 11px var(--sans);letter-spacing:.3em;color:var(--o2)}
.mmh h1{font:500 clamp(34px,10vw,52px)/1.15 var(--disp);margin:10px 0 8px}.mmh p{margin:0 auto;max-width:28ch;color:var(--mut)}
.scrap{position:relative;margin:10px 16px 16px;padding:30px 16px 24px;border-radius:6px;box-shadow:0 10px 28px #0000003d;border:1px solid #c9a24a88;background:linear-gradient(#f7f2e3,#e9e3cc)}
.scrap::before{content:"";position:absolute;inset:7px;border:1px dashed #c9a24a;border-radius:3px;pointer-events:none}
.pol{position:relative;background:#fffdf7;padding:12px 12px 58px;box-shadow:0 8px 22px #0004;transform:rotate(-1.4deg);max-width:330px;margin:0 auto}
.pol .tp{position:absolute;top:-15px;left:50%;width:104px;height:28px;margin-left:-52px;background:#c9a24acc;transform:rotate(3deg);box-shadow:0 1px 3px #0003}
.pol .ph{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#0c1f14;border-radius:2px}
.pol .ph.wait{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--c);padding:18px;font-size:20px;line-height:1.4}.pol .ph.wait p{margin:0}.pol .ph.wait small{font:400 12px var(--sans);opacity:.75}
.pol .cap{position:absolute;left:8px;right:8px;bottom:12px;text-align:center;font:600 24px/1.1 'Dancing Script','Brush Script MT',cursive;color:var(--g)}
.mir{transform:scaleX(-1)}
.camb{display:flex;align-items:center;justify-content:space-between;margin:24px auto 0;max-width:330px}
.shut{width:78px;height:78px;border-radius:50%;border:4px solid var(--g);background:radial-gradient(circle,var(--o) 0 62%,var(--c) 64%)}
.flip{width:52px;height:52px;border-radius:50%;border:1px solid var(--g);background:none;font-size:24px;line-height:1}.sp2{width:52px}
.rowb{display:flex;gap:12px}.rowb .cta{flex:1;justify-content:center;margin-top:0}
.pg .cta[data-gen]{width:100%;margin-top:12px;text-align:center}
/* ===== Memory book ===== */
.drv{display:flex;flex-direction:column;align-items:center;text-align:center;margin:10px 0}.drv .cta{justify-content:center;margin-top:0}.drv .cta.off{opacity:.55;cursor:default}.drv p{margin:10px 0 0;max-width:30ch;color:var(--mut);font-size:18px;line-height:1.4}.grid5 .drv{grid-column:1/-1;margin:14px 0 6px}
.phi{display:block;max-width:100%;max-height:340px;width:auto;height:auto;margin:0 auto 12px;border-radius:10px}
.bk{text-align:center;margin-bottom:8px}.bk small{font:500 11px var(--sans);letter-spacing:.16em;color:var(--o2)}
.bk h3{margin:8px 0 6px;font:600 26px/1.25 var(--disp)}.bk p{margin:0 0 6px}
.bk .cta{display:flex;justify-content:center;width:100%}
</style>

const SKEY='parampara-session-v2',WHO=['Mom','Dad','Grandfather','Grandmother'];
let G=null;try{G=JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){}
if(!G||!G.sid||!G.child)G=null;else{if(!Array.isArray(G.who))G.who=[];G.parent=G.parent||''}
if(/[?&]reset(=|&|$)/.test(location.search)){try{localStorage.removeItem(SKEY)}catch(e){}G=null}

let done=new Set();
const loadDone=()=>{done=new Set();try{if(G)done=new Set(JSON.parse(localStorage.getItem('parampara-done-v2:'+G.sid)||'[]'))}catch(e){}};
const save=()=>{try{if(G)localStorage.setItem('parampara-done-v2:'+G.sid,JSON.stringify([...done]))}catch(e){}};

const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=x=>x.trim().replace(/\s+/g,' ').split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const joinList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' & '+a[a.length-1];
const shown=()=>{const pr=['Mom','Dad'].filter(w=>G.who.includes(w));return pr.length?pr:['Grandfather','Grandmother'].filter(w=>G.who.includes(w))};
const greet=()=>{const w=shown();return esc(G.child)+'’s '+(w.length?joinList(w):'Family')};
const WC=['All',...WHO];let sel=new Set();

 saveG();FRESH=false;$('#gate').classList.remove('on');document.body.classList.remove('lock');

 try{

  const url=CFG.supabaseUrl+'/storage/v1/object/'+encodeURIComponent(CFG.bucket)+'/'+path.split('/').map(encodeURIComponent).join('/');
  const r=await fetch(url,{method:'POST',headers:{apikey:CFG.anonKey,Authorization:'Bearer '+CFG.anonKey,'Content-Type':b.type||'image/jpeg','x-upsert':'false'},body:b});
  if(!r.ok)throw new Error('Storage upload failed ('+r.status+')');

}

function stopCam(){if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null}}

function camAfter(){const v=$('#cam');if(v&&CAM.stream){v.srcObject=CAM.stream;const p=v.play();if(p&&p.catch)p.catch(()=>{})}
 if(ROUTE==='memories'&&G&&PHREADY&&allDone()&&!(PH.final&&G.final)&&CAM.step==='idle'&&!CAM.started){CAM.started=1;startCam()}}
async function startCam(){stopCam();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||window.isSecureContext===false){CAM.step='unsupported';keep();return}
 CAM.step='asking';keep();
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:CAM.facing},width:{ideal:1920},height:{ideal:1440}},audio:false});
  if(ROUTE!=='memories'){s.getTracks().forEach(t=>t.stop());return}
  CAM.stream=s;CAM.step='live'}
 catch(e){const n=e&&e.name;CAM.step=(n==='NotAllowedError'||n==='SecurityError'||n==='PermissionDeniedError')?'denied':(n==='NotFoundError'||n==='OverconstrainedError'||n==='DevicesNotFoundError')?'unsupported':'error'}

 return bar('Activity Postcard')+`<p class="lead">Visit a corner, add a photo, tap Done, and its stamp lands on your postcard. Collect all 10 stamps to unlock your final photo.</p><div class="pcd"><div class="pch"><div><h2>PARAMPARA</h2>${G?`<div class="cn">${esc(G.child)}’s Postcard</div>`:''}<p>THE LITTLES PRESCHOOL · ${evDate()}</p></div><svg class="pm" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="50" y="46" text-anchor="middle" font-size="11" font-family="Poppins,sans-serif" fill="currentColor" letter-spacing="1.5">PARAMPARA</text><text x="50" y="62" text-anchor="middle" font-size="10" font-family="Poppins,sans-serif" fill="currentColor">2 NOV 2026</text></svg></div>
